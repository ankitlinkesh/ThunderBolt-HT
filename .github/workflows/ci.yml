# Thunderbolt HT - continuous integration.
#
# WHY THIS EXISTS. Every green result reported anywhere in this project's history
# up to this workflow's addition came from a manual build+test run on the one
# machine this was developed on. Nothing stopped a change from silently breaking
# Debug, ASan, or the determinism hash between sessions - this is the guard that
# closes that gap.
#
# Deliberately NOT using the pinned CMakePresets.json Windows toolset (MSVC
# 14.51 / "Visual Studio 18 2026"): that pin exists so S87's reproducibility
# block always names an exact, known compiler on the machine this project was
# developed on. A hosted runner has whatever toolchain its image ships, which is
# the point here - this workflow verifies the project builds and passes on A
# supported toolchain, not THE exact pinned one.
#
# Linux jobs DO use the CMakePresets.json linux-* presets (added alongside this
# workflow) rather than raw cmake invocations, unlike the Windows jobs above
# them - there is no toolset-pin conflict to route around on Linux, so there is
# no reason not to exercise the presets a real contributor would actually use.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@v4

      # THUNDERBOLT_REFERENCE_RUNTIMES stays OFF here on purpose, mirroring its
      # documented default: "a core build must never depend on the network."
      # This is the gate that promise is actually checked against.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --parallel

      # Runs all four repo-level ctest entries: the unit/conformance suite,
      # architecture_layering, thunderbolt_builds_standalone, and
      # simulation_determinism - the check that substitutes for the
      # ThreadSanitizer MSVC does not have (Linux's clang-tsan job below is the
      # real one).
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-asan:
    name: Windows AddressSanitizer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@v4

      # Mirrors the local `asan` preset: RelWithDebInfo, because
      # /fsanitize=address does not compose with the /RTC1 Debug enables by
      # default. The DLL-path fix for clang_rt.asan_dynamic-*.dll is baked into
      # thunderbolt/tests/CMakeLists.txt and tests/CMakeLists.txt as an
      # ENVIRONMENT_MODIFICATION on the test properties themselves, so it applies
      # here with no extra CI-side setup - that was the whole point of fixing it
      # at the CMake level instead of in a shell script.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS=/fsanitize=address
          "-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG /INCREMENTAL:NO"
          "-DCMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG /INCREMENTAL:NO"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-with-taskflow-reference:
    name: Windows Taskflow reference leg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@v4

      # The Taskflow-linked path (benchmarks/experiments/Granularity.cpp,
      # game_benchmarks/TaskflowSim.cpp) is otherwise never built in CI, since
      # THUNDERBOLT_REFERENCE_RUNTIMES defaults OFF. Every "beats Taskflow"
      # result this project reports comes from this code path, so it needs its
      # own gate rather than trusting that OFF-by-default coverage implies it.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTHUNDERBOLT_REFERENCE_RUNTIMES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Smoke-runs the Taskflow-linked binaries themselves, not just their
      # build: a link error in an #if THUNDERBOLT_HAVE_TASKFLOW block would
      # otherwise only surface the first time someone builds with the flag on,
      # which - before this workflow - was rare enough to go unnoticed.
      - name: Smoke test Taskflow-linked benchmarks
        run: |
          ./build/bin/thunderbolt-bench.exe --experiment granularity --reps 2 --warmup 0
          ./build/bin/thunderbolt-sim.exe --scene 100_npcs --ticks 5 --ab standard,thunderbolt,taskflow --reps 2 --warmup 0

  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-gcc-debug
          - linux-gcc-release
          - linux-clang-debug
          - linux-clang-release
    steps:
      - uses: actions/checkout@v4

      # Every linux-* CMakePresets.json preset sets generator "Ninja", and
      # ubuntu-latest does not ship ninja-build by default (unlike the Windows
      # jobs above, which install it explicitly). Missing this the first time
      # made every Linux job fail identically at the configure step, in
      # seconds, regardless of gcc vs clang - a generator-not-found error, not
      # anything about the C++ code these presets were added to build.
      - uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  linux-asan:
    name: Linux Clang AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset linux-clang-asan

      - name: Build
        run: cmake --build --preset linux-clang-asan --parallel

      - name: Test
        run: ctest --preset linux-clang-asan

  linux-tsan:
    name: Linux Clang ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v4

      # The first real race detector this project has ever run under. MSVC has
      # none at all; docs/RESULTS.md repeatedly documents the determinism hash
      # plus repeated ASan runs as the substitute, explicitly weaker evidence.
      # A TSan failure here would be the first genuine confirmation (or
      # refutation) of that residual risk, not just another format of the same
      # evidence already gathered.
      - name: Configure
        run: cmake --preset linux-clang-tsan

      - name: Build
        run: cmake --build --preset linux-clang-tsan --parallel

      - name: Test
        run: ctest --preset linux-clang-tsan

  linux-with-taskflow-reference:
    name: Linux Taskflow reference leg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTHUNDERBOLT_REFERENCE_RUNTIMES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test Taskflow-linked benchmarks
        run: |
          ./build/bin/thunderbolt-bench --experiment granularity --reps 2 --warmup 0
          ./build/bin/thunderbolt-sim --scene 100_npcs --ticks 5 --ab standard,thunderbolt,taskflow --reps 2 --warmup 0
